[package]
name = "runnermesh"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Human-first CI capacity orchestration for interactive developer workstations."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
