name: Immutable RC Candidate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-hex authoritative main commit to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: immutable-v0-1-rc
  cancel-in-progress: false

jobs:
  package:
    name: Package exact Windows x64 RC
    runs-on: windows-latest
    env:
      RUNNERMESH_BUILD_COMMIT: ${{ github.sha }}
      RUNNERMESH_BUILD_CHANNEL: rc
    steps:
      - name: Admit exact authoritative main
        shell: pwsh
        env:
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          if ($env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$') {
            throw 'expected_commit must be exact lowercase 40-hex'
          }
          if ($env:SELECTED_REF -ne 'refs/heads/main') {
            throw 'RC packaging is restricted to the authoritative main branch'
          }
          if ($env:SELECTED_SHA -cne $env:EXPECTED_COMMIT) {
            throw 'selected workflow commit does not match expected_commit'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build exact Windows x64 binaries outside the source tree
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runnermesh-build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bins
      - name: Execute the installed RC runtime before packaging
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runnermesh-build
        run: |
          $ErrorActionPreference = 'Stop'
          $binaryRoot = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release'
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("runnermesh-rc-smoke-" + [guid]::NewGuid().ToString('N'))
          cargo run --locked --example g15r-rc-smoke -- `
            (Join-Path $binaryRoot 'runnermesh-agent.exe') `
            (Join-Path $binaryRoot 'runnermesh.exe') `
            (Join-Path $PWD 'resources\runnermesh-agent.manifest') `
            $smokeRoot `
            $env:RUNNERMESH_BUILD_COMMIT `
            $env:RUNNERMESH_BUILD_CHANNEL
          if ($LASTEXITCODE -ne 0) { throw 'installed RC runtime smoke failed' }
      - name: Create and independently read back the immutable package
        id: package
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runnermesh-build
          SOURCE_ROOT: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'runnermesh-release'
          $binaryRoot = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release'
          [IO.Directory]::CreateDirectory($releaseRoot) | Out-Null
          $packager = Join-Path $releaseRoot 'runnermesh-package.exe'
          [IO.File]::Copy((Join-Path $binaryRoot 'runnermesh-package.exe'), $packager, $false)
          $operatorIdentity = (& $packager identity | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 `
              -or $operatorIdentity.provenance.version -cne '0.1.0' `
              -or $operatorIdentity.provenance.commit -cne $env:RUNNERMESH_BUILD_COMMIT `
              -or $operatorIdentity.provenance.channel -cne 'rc' `
              -or $operatorIdentity.provenance.target -cne 'x86_64-pc-windows-msvc') {
            throw 'operator helper provenance does not match the admitted RC identity'
          }
          & $packager create $releaseRoot '0.1.0' $env:RUNNERMESH_BUILD_COMMIT 'rc' `
            (Join-Path $binaryRoot 'runnermesh.exe') `
            (Join-Path $binaryRoot 'runnermesh-agent.exe') `
            (Join-Path $env:SOURCE_ROOT 'resources\runnermesh-agent.manifest')
          if ($LASTEXITCODE -ne 0) { throw 'package creation failed' }

          $archive = Join-Path $releaseRoot 'runnermesh-0.1.0-windows-x64.zip'
          $verified = (& $packager verify $archive | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'package verification failed' }
          if ($verified.archive_sha256 -notmatch '^[0-9a-f]{64}$') {
            throw 'archive verification did not return an exact SHA-256'
          }
          $independentHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($independentHash -cne $verified.archive_sha256) {
            throw 'independent archive SHA-256 differs from package verification'
          }
          $operatorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $packager).Hash.ToLowerInvariant()
          if ($operatorHash -notmatch '^[0-9a-f]{64}$') {
            throw 'operator helper verification did not return an exact SHA-256'
          }
          if ($verified.provenance.version -cne '0.1.0' `
              -or $verified.provenance.commit -cne $env:RUNNERMESH_BUILD_COMMIT `
              -or $verified.provenance.channel -cne 'rc' `
              -or $verified.provenance.target -cne 'x86_64-pc-windows-msvc') {
            throw 'package provenance does not match the admitted RC identity'
          }

          $shaPath = "$archive.sha256"
          [IO.File]::WriteAllText(
            $shaPath,
            "$($verified.archive_sha256)  $([IO.Path]::GetFileName($archive))`n",
            [Text.UTF8Encoding]::new($false)
          )
          $operatorShaPath = "$packager.sha256"
          [IO.File]::WriteAllText(
            $operatorShaPath,
            "$operatorHash  $([IO.Path]::GetFileName($packager))`n",
            [Text.UTF8Encoding]::new($false)
          )
          $provenancePath = Join-Path $releaseRoot 'runnermesh-0.1.0-windows-x64.provenance.json'
          $receipt = [ordered]@{
            schema_version = 1
            archive = [IO.Path]::GetFileName($archive)
            archive_sha256 = $verified.archive_sha256
            operator_helper = [IO.Path]::GetFileName($packager)
            operator_helper_sha256 = $operatorHash
            provenance = $verified.provenance
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText(
            $provenancePath,
            "$receipt`n",
            [Text.UTF8Encoding]::new($false)
          )
          "archive_sha256=$($verified.archive_sha256)" >> $env:GITHUB_OUTPUT
          "operator_helper_sha256=$operatorHash" >> $env:GITHUB_OUTPUT
      - name: Execute immutable operator install and owned uninstall smoke
        shell: pwsh
        env:
          ACCEPTED_ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'runnermesh-release'
          $packager = Join-Path $releaseRoot 'runnermesh-package.exe'
          $archive = Join-Path $releaseRoot 'runnermesh-0.1.0-windows-x64.zip'
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("runnermesh-operator-smoke-" + [guid]::NewGuid().ToString('N'))
          [IO.Directory]::CreateDirectory($smokeRoot) | Out-Null
          $staging = Join-Path $smokeRoot 'verified-payload'
          $installed = Join-Path $smokeRoot 'installed'
          $receipt = (& $packager install $archive $env:ACCEPTED_ARCHIVE_SHA256 $staging $installed | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 `
              -or $receipt.result -cne 'installed' `
              -or -not $receipt.activated `
              -or $receipt.provenance.commit -cne $env:RUNNERMESH_BUILD_COMMIT) {
            throw 'immutable operator install smoke failed'
          }
          $uninstall = (& $packager uninstall $installed | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 `
              -or $uninstall.result -cne 'uninstalled' `
              -or -not $uninstall.root_removed `
              -or (Test-Path -LiteralPath $installed)) {
            throw 'immutable operator owned uninstall smoke failed'
          }
          "IMMUTABLE_OPERATOR=PASS"
          "OPERATOR_INSTALL=PASS"
          "OPERATOR_UNINSTALL=PASS"
      - name: Upload only the frozen RC package, operator, and verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runnermesh-0.1.0-windows-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runnermesh-release/runnermesh-0.1.0-windows-x64.zip
            ${{ runner.temp }}/runnermesh-release/runnermesh-0.1.0-windows-x64.zip.sha256
            ${{ runner.temp }}/runnermesh-release/runnermesh-0.1.0-windows-x64.provenance.json
            ${{ runner.temp }}/runnermesh-release/runnermesh-package.exe
            ${{ runner.temp }}/runnermesh-release/runnermesh-package.exe.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
